baseURL = "https://clintdavis.us/"
title = "Clint Davis"
locale = "en-us"
defaultContentLanguage = "en"
enableRobotsTXT = true

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[pagination]
  pagerSize = 20

[params]
  description = "Clint Davis is a senior full-stack software engineer who builds reliable software for complex, real-world work."
  author = "Clint Davis"
  email = "clint@clintdavis.us"
  github = "https://github.com/clintdavis77"
  ogImage = "/images/og-default.png"
  favicon = "/favicon.svg"

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.parser]
  autoHeadingID = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false

[markup.highlight]
  noClasses = false
  style = "monokai"
